name: Release request

# Received from the private artifact authority via an authenticated GitHub App dispatch.
# This workflow NEVER publishes. It verifies the signed manifest and opens/updates a version PR.

on:
  repository_dispatch:
    types: [release-request]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-open-pr:
    name: Verify manifest and open version PR
    runs-on: ubuntu-latest
    env:
      REQ_VERSION: ${{ github.event.client_payload.version }}
      REQ_MANIFEST_URL: ${{ github.event.client_payload.manifestUrl }}
      REQ_MANIFEST_SHA256: ${{ github.event.client_payload.manifestSha256 }}
      REQ_SENDER: ${{ github.event.sender.login }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate request payload, manifest signature, digest, and monotonic version
        run: node scripts/verify-release-request.mjs
      - name: Prepare version bump on a branch
        run: node scripts/prepare-version-pr.mjs
      - name: Open or update the version pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/open-version-pr.mjs
