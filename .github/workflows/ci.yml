name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and disclosure scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Installer verification test suite
        run: node --test test/*.test.mjs
      - name: Validate release-manifest schema is well-formed
        run: node scripts/validate-schema.mjs
      - name: Disclosure scan (no private references)
        run: node scripts/scan-disclosure.mjs
      - name: Documentation link check
        run: node scripts/check-links.mjs
      - name: Installer fail-closed smoke
        run: node scripts/smoke-install.mjs
