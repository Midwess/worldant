name: Build and release Worldant

# Builds the worldant CLI from private source on every supported platform, bootstrapping the
# embedded Bun engine (vendor/bun C++ objects) and running the engine test suite per platform
# before packaging. The release job (sign + npm + GitHub Release) runs only when run_release is
# true, so platform bring-up can iterate on build+test without publishing anything.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version
        required: true
        default: 1.2.0
      source_ref:
        description: Private source branch, tag, or SHA
        required: true
        default: main
      run_release:
        description: Sign, publish to npm, and create the GitHub Release (leave false to only build+test)
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test ${{ matrix.key }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            key: darwin-arm64
            go-archive: darwin-arm64
            checker-binary: worldant-tscheck-darwin-arm64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            key: linux-x64
            go-archive: linux-amd64
            checker-binary: worldant-tscheck-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            key: linux-arm64
            go-archive: linux-arm64
            checker-binary: worldant-tscheck-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: public

      - name: Check out private release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Midwess/worldant-internal
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source

      - name: Check out engine and data-plane sources
        env:
          SUBMODULE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf "git@github.com:"
          # Embedded Bun engine submodule (public).
          git -C source submodule update --init --recursive vendor/bun
          # The workspace resolves its data-plane path deps from a sibling
          # ../PgPaw checkout (root Cargo.toml). Its URL and commit come from
          # source so no private identifiers live in this public workflow; the
          # pinned commit's nested submodule pins match source's (tree alignment).
          pgpaw_url="$(git -C source config -f .gitmodules submodule.pgpaw.url)"
          pgpaw_sha="$(git -C source rev-parse HEAD:pgpaw)"
          git clone "$pgpaw_url" PgPaw
          git -C PgPaw checkout "$pgpaw_sha"
          git -C PgPaw config -f .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}' | while read -r sub; do
            [ "$sub" = "docs" ] && continue
            git -C PgPaw submodule update --init --recursive "$sub"
          done
          if [ "${{ matrix.key }}" = "linux-x64" ]; then
            git -C source config -f .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}' | while read -r sub; do
              case "$sub" in
                docs|pgpaw|vendor/bun) continue ;;
              esac
              git -C source submodule update --init --recursive "$sub"
            done
          fi

      - name: Read and validate the checker pin
        id: checker
        env:
          GO_ARCHIVE_KEY: ${{ matrix.go-archive }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs")
          const pin = JSON.parse(readFileSync("source/tools/typescript-checker/pin.json", "utf8"))
          const fail = (message) => { throw new Error(message) }
          if (pin.schema !== "worldant.typescript-checker-pin.v1") fail("unsupported checker pin schema")
          if (pin.typescript_go?.repository !== "https://github.com/microsoft/typescript-go.git") fail("unexpected TypeScript-Go repository")
          if (!/^[0-9a-f]{40}$/.test(pin.typescript_go?.commit ?? "")) fail("invalid TypeScript-Go commit")
          if (!/^\d+\.\d+\.\d+$/.test(pin.go?.version ?? "")) fail("invalid Go version")
          const archive = pin.go?.archives?.[process.env.GO_ARCHIVE_KEY]
          if (!archive || !/^go\d+\.\d+\.\d+\.[a-z0-9-]+\.tar\.gz$/.test(archive.file) || !/^[0-9a-f]{64}$/.test(archive.sha256)) fail("invalid Go archive pin")
          if (!/^\d+\.\d+\.\d+$/.test(pin.native_platform_types?.["@types/node"] ?? "")) fail("invalid @types/node pin")
          if (!/^\d+\.\d+\.\d+$/.test(pin.native_platform_types?.["undici-types"] ?? "")) fail("invalid undici-types pin")
          if (!/^[0-9a-f]{40}$/.test(pin.native_platform_types?.bun_repository_commit ?? "")) fail("invalid Bun types commit")
          const outputs = {
            typescript_go_commit: pin.typescript_go.commit,
            go_version: pin.go.version,
            go_archive_file: archive.file,
            go_archive_sha256: archive.sha256,
            node_types_version: pin.native_platform_types["@types/node"],
            undici_types_version: pin.native_platform_types["undici-types"],
            bun_types_commit: pin.native_platform_types.bun_repository_commit,
          }
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs).map(([key, value]) => `${key}=${value}\n`).join(""))
          NODE

      - name: Install pinned Go toolchain
        env:
          GO_ARCHIVE_FILE: ${{ steps.checker.outputs.go_archive_file }}
          GO_ARCHIVE_SHA256: ${{ steps.checker.outputs.go_archive_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p checker-toolchain
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://go.dev/dl/$GO_ARCHIVE_FILE" \
            --output "checker-toolchain/$GO_ARCHIVE_FILE"
          printf '%s  %s\n' "$GO_ARCHIVE_SHA256" "checker-toolchain/$GO_ARCHIVE_FILE" | shasum -a 256 --check
          tar -C checker-toolchain -xzf "checker-toolchain/$GO_ARCHIVE_FILE"
          go_platform='${{ matrix.go-archive }}'
          go_platform="${go_platform/-//}"
          test "$(checker-toolchain/go/bin/go version)" = "go version go${{ steps.checker.outputs.go_version }} $go_platform"

      - name: Prepare pinned checker sources and declarations
        env:
          TYPESCRIPT_GO_COMMIT: ${{ steps.checker.outputs.typescript_go_commit }}
          NODE_TYPES_VERSION: ${{ steps.checker.outputs.node_types_version }}
          UNDICI_TYPES_VERSION: ${{ steps.checker.outputs.undici_types_version }}
          BUN_TYPES_COMMIT: ${{ steps.checker.outputs.bun_types_commit }}
        run: |
          set -euo pipefail
          mkdir -p checker-input/packages
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/typescript-go.git checker-input/typescript-go
          git -C checker-input/typescript-go checkout --detach "$TYPESCRIPT_GO_COMMIT"
          test "$(git -C checker-input/typescript-go rev-parse HEAD)" = "$TYPESCRIPT_GO_COMMIT"
          test "$(git -C source/vendor/bun rev-parse HEAD)" = "$BUN_TYPES_COMMIT"
          node_pack="$(npm pack --silent --pack-destination checker-input/packages "@types/node@$NODE_TYPES_VERSION" | tail -n 1)"
          undici_pack="$(npm pack --silent --pack-destination checker-input/packages "undici-types@$UNDICI_TYPES_VERSION" | tail -n 1)"
          mkdir -p checker-input/node-types checker-input/undici-types
          tar -C checker-input/node-types --strip-components=1 -xzf "checker-input/packages/$node_pack"
          tar -C checker-input/undici-types --strip-components=1 -xzf "checker-input/packages/$undici_pack"

      - name: Build and verify the pinned TypeScript checker bundle
        env:
          CHECKER_COMMIT: ${{ steps.checker.outputs.typescript_go_commit }}
          CHECKER_BINARY: ${{ matrix.checker-binary }}
          CHECKER_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source/tools/typescript-checker/build.sh \
            "$GITHUB_WORKSPACE/checker-input/typescript-go" \
            "$GITHUB_WORKSPACE/checker-toolchain/go/bin/go" \
            "$GITHUB_WORKSPACE/checker-input/node-types" \
            "$GITHUB_WORKSPACE/checker-input/undici-types" \
            "$GITHUB_WORKSPACE/source/vendor/bun/packages/bun-types" \
            "$GITHUB_WORKSPACE/source/tools/typescript-checker/release"
          checker_root="source/tools/typescript-checker/release/libexec/worldant/typescript/$CHECKER_COMMIT"
          test -x "$checker_root/$CHECKER_BINARY"
          "$checker_root/$CHECKER_BINARY" \
            < source/tools/typescript-checker/fixtures/semantic-error.json \
            > checker-response.json
          node -e 'const response = require("./checker-response.json"); if (response.protocol !== "worldant.typescript-checker.v1" || response.failure || !Array.isArray(response.diagnostics) || response.diagnostics.length === 0) throw new Error("checker smoke response is invalid")'

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@21 ninja

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 lld
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          {
            echo "CC=clang-21"
            echo "CXX=clang++-21"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang-21"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=clang-21"
          } >> "$GITHUB_ENV"

      - name: Install bun (runs bun's own C++ codegen)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Rust toolchain from rust-toolchain.toml
        working-directory: source
        run: rustup show

      - name: Resolve bun submodule commit for cache key
        id: bun
        working-directory: source
        run: echo "sha=$(git -C vendor/bun rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the bun engine build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            source/vendor/bun/build
            source/vendor/bun/vendor
            ~/.bun/build-cache
          key: bun-v2-${{ matrix.key }}-${{ steps.bun.outputs.sha }}

      - name: Bootstrap the embedded Bun engine
        working-directory: source
        env:
          WORLDANT_BUN_TARGET: ${{ matrix.target }}
        run: scripts/bun/bootstrap.sh

      - name: Build CLI
        working-directory: source
        env:
          CARGO_INCREMENTAL: "0"
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm -f Cargo.toml.bak
          cargo build --release --target "$TARGET" -p worldant-cli --bin worldant

      - name: Compare native and browser TypeScript diagnostics
        working-directory: source
        env:
          TARGET: ${{ matrix.target }}
          CHECKER_COMMIT: ${{ steps.checker.outputs.typescript_go_commit }}
          CHECKER_BINARY: ${{ matrix.checker-binary }}
        run: |
          set -euo pipefail
          cargo build --release --target "$TARGET" -p world-compiler --example typescript_normalize
          node tools/typescript-checker/conformance.mjs \
            "target/$TARGET/release/examples/typescript_normalize" \
            "tools/typescript-checker/release/libexec/worldant/typescript/$CHECKER_COMMIT/$CHECKER_BINARY" \
            tools/typescript-checker/release/browser/wasm_exec.js \
            tools/typescript-checker/release/browser/worldant-tscheck.wasm \
            tools/typescript-checker/fixtures

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        if: matrix.key == 'linux-x64'
        with:
          node-version: 22

      - name: Install browser package tooling
        if: matrix.key == 'linux-x64'
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Package TypeScript release
        if: matrix.key == 'linux-x64'
        env:
          VERSION: ${{ inputs.version }}
        run: bash source/scripts/package-npm.sh "$VERSION" "$GITHUB_WORKSPACE/worldant-$VERSION.tgz"

      - name: Test the engine on this platform
        working-directory: source
        env:
          CARGO_INCREMENTAL: "0"
          TARGET: ${{ matrix.target }}
        run: cargo test --release --target "$TARGET" --workspace --exclude world-browser --exclude integration-test

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          KEY: ${{ matrix.key }}
          TARGET: ${{ matrix.target }}
          CHECKER_COMMIT: ${{ steps.checker.outputs.typescript_go_commit }}
          CHECKER_BINARY: ${{ matrix.checker-binary }}
        run: |
          set -euo pipefail
          checker_root="source/tools/typescript-checker/release/libexec/worldant/typescript/$CHECKER_COMMIT"
          package_checker="package/libexec/worldant/typescript/$CHECKER_COMMIT"
          test -x "$checker_root/$CHECKER_BINARY"
          mkdir -p package/bin "$package_checker"
          cp "source/target/$TARGET/release/worldant" package/bin/worldant
          cp -R "$checker_root/." "$package_checker/"
          chmod +x package/bin/worldant
          tar -C package -czf "worldant-$VERSION-$KEY.tar.gz" \
            bin/worldant "libexec/worldant/typescript/$CHECKER_COMMIT"
          node public/scripts/verify-release-archive.mjs \
            "worldant-$VERSION-$KEY.tar.gz" \
            source/tools/typescript-checker/pin.json \
            "$TARGET" \
            "$CHECKER_BINARY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: worldant-${{ matrix.key }}
          path: worldant-${{ inputs.version }}-${{ matrix.key }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: matrix.key == 'linux-x64'
        with:
          name: worldant-npm
          path: worldant-${{ inputs.version }}.tgz
          if-no-files-found: error

  release:
    name: Sign, publish, and verify
    needs: build
    if: ${{ inputs.run_release == true }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: worldant-*
          merge-multiple: true
          path: release-assets
      - name: Assemble release evidence and manifest
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: node scripts/assemble-release.mjs
      - name: Sign manifest with sigstore-js
        run: node scripts/sign-release.mjs
      - name: Create draft release and upload every asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --draft --title "Worldant v$VERSION" --notes-file CHANGELOG.md
          gh release upload "v$VERSION" release-assets/* --clobber
      - name: Verify npm release install
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e 'const manifest = require("./packages/cli/package.json"); if (manifest.name !== "@midwess/worldant-cli" || manifest.version !== process.env.VERSION) throw new Error("CLI package identity does not match release")'
          npm install --ignore-scripts --no-package-lock --prefix npm-smoke "./release-assets/worldant-$VERSION.tgz"
          (cd npm-smoke && node --input-type=module -e 'const manifest = await import("./node_modules/@midwess/worldant/package.json", { with: { type: "json" } }); if (manifest.default.version !== process.env.VERSION) throw new Error("TypeScript package install mismatch"); const root = await import("@midwess/worldant"); const client = await import("@midwess/worldant/client"); if (typeof root.defineCommand !== "function" || typeof client.createWorld !== "function") throw new Error("TypeScript package exports are unavailable")')
      - name: Publish npm TypeScript package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          published="$(npm view @midwess/worldant@"$VERSION" version 2>/dev/null || true)"
          [ "$published" = "$VERSION" ] || npm publish "release-assets/worldant-$VERSION.tgz" --access public --provenance
      - name: Publish npm CLI installer
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          published="$(npm view @midwess/worldant-cli@"$VERSION" version 2>/dev/null || true)"
          [ "$published" = "$VERSION" ] || npm publish --access public --provenance
      - name: Verify npm publications
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            library="$(npm view @midwess/worldant@"$VERSION" version 2>/dev/null || true)"
            installer="$(npm view @midwess/worldant-cli@"$VERSION" version 2>/dev/null || true)"
            [ "$library" = "$VERSION" ] && [ "$installer" = "$VERSION" ] && exit 0
            sleep 5
          done
          exit 1
      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest
