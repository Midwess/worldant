name: Feature request
description: Suggest an improvement to packaging, the installer, examples, or public documentation.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Worldant's public surface makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? Runtime feature requests are triaged and implemented privately.
    validations:
      required: true
